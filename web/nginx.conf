# =============================================================
# Tier 1 — Web Server Nginx Configuration
# =============================================================
# This config serves the static web files (index.html, config.js)
# on Port 80.
#
# Installation on Tier 1 EC2:
#   sudo cp nginx.conf /etc/nginx/sites-available/zomato
#   sudo ln -s /etc/nginx/sites-available/zomato /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;                  # Accepts any hostname / IP

    # Root directory: where your cloned zomatoapp/web folder lives
    root /home/ubuntu/zomatoapp/web;
    index index.html;

    # -------------------------------------------------------
    # SPA Routing: serve index.html for all non-file paths
    # (/home, /cart, /orders, /login, /signup)
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------
    # Cache static assets (JS, CSS embedded in HTML)
    # -------------------------------------------------------
    location ~* \.(js|css|png|jpg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------
    # Security headers
    # -------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
